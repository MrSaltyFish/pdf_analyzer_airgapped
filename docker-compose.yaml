version: "3.9"

services:
  # -----------------------------
  # 1️⃣ RAG Backend
  # -----------------------------
  rag_backend:
    build:
      context: .
      dockerfile: services/rag_backend/Dockerfile
    container_name: rag_backend
    ports:
      - "8001:8001"
    volumes:
      - ./shared/models:/models
      - ./services/rag_backend:/app
    environment:
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
    restart: unless-stopped

  # -----------------------------
  # 2️⃣ Mistral AI Generation Backend
  # -----------------------------
  mistral_backend:
    build:
      context: .
      dockerfile: services/mistral_backend/Dockerfile
    container_name: mistral_backend
    ports:
      - "8002:8002"
    volumes:
      - ./shared/models:/models
      - ./services/mistral_backend:/app
      - ./shared/models/mistral-7b-v0.1.Q4_0:/models/mistral
    environment:
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # -----------------------------
  # 3️⃣ Next.js Frontend
  # -----------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8080/api/v1
    depends_on:
      - rag_backend
      - mistral_backend
    restart: unless-stopped

  # -----------------------------
  # 4️⃣ NGINX Gateway (optional but recommended)
  # -----------------------------
  nginx:
    image: nginx:latest
    container_name: nginx_gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rag_backend
      - mistral_backend
      - frontend
    restart: unless-stopped
