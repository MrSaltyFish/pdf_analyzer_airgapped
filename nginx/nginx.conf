pid /home/fishy/Data/College/College-Projects/pdf_analyzer_airgapped/nginx/logs/nginx.pid;
events {}
http {       
    
    access_log logs/access.log;
    error_log logs/error.log;

    server {
        listen 8080;

        location /api/v1/rag/ {
            proxy_pass http://rag_backend:8001/api/v1/rag/;
        }

        location /api/v1/synthesis/ {
            proxy_pass http://mistral_backend:8002/api/v1/synthesis/;
        }

        location / {
            proxy_pass http://frontend:3000;
        }
    }
}
